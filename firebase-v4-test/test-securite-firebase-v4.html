<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit lecture seule — Firebase V4 TEST</title><style>body{font:16px system-ui,Arial;background:#111318;color:#f4f4f5;max-width:720px;margin:auto;padding:18px}section{background:#20232b;padding:16px;border-radius:12px;margin:14px 0}input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 12px;border-radius:8px;font:inherit}input{background:#101115;border:1px solid #656b77;color:white}button{background:#d7b16a;border:0;font-weight:bold}button:disabled{opacity:.6}.ok{color:#9df0b6}.bad{color:#ff9898}.neutral{color:#ccc}li{margin:12px 0;overflow-wrap:anywhere}small{color:#aaa}</style></head><body><h1>🔐 Audit Firebase V4 TEST</h1><p>Test de lecture seule : <strong>aucune écriture</strong> et aucune modification de stock. À utiliser avec le compte employé Marko, jamais avec l'administrateur.</p><section><label>E-mail du collaborateur<input id="email" type="email" autocomplete="username" placeholder="Adresse de Marko"></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password"></label><label>ID du dépôt interdit (facultatif)<input id="forbidden" placeholder="ID Firestore de Dépôt secondaire"></label><small>Sans cet ID, le test vérifie quand même que les listes globales sont interdites.</small><button id="run">Lancer les vérifications</button><button id="logout" type="button">Déconnexion du test</button></section><section><strong id="status">Prêt.</strong><ol id="results"></ol></section><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import{getAuth,setPersistence,inMemoryPersistence,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import{getFirestore,doc,getDoc,collection,getDocs,query,limit}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyBCHdvyoeVYENGTIQz-S5UkZvELHg-yRJ4',authDomain:'gestion-stock-boisson-test.firebaseapp.com',projectId:'gestion-stock-boisson-test',storageBucket:'gestion-stock-boisson-test.firebasestorage.app',messagingSenderId:'928921226084',appId:'1:928921226084:web:63ac29ab33b3cccf89c871'};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),base=['structures','punish-concept'];
const $=id=>document.getElementById(id);let passed=0,failed=0;
function report(name,success,details){const li=document.createElement('li');li.className=success?'ok':'bad';li.textContent=(success?'✓ ':'✗ ')+name+' — '+details;$('results').append(li);if(success)passed++;else failed++;}
async function test(name,expectedAllowed,action){try{await action();report(name,expectedAllowed,expectedAllowed?'Lecture autorisée comme prévu':'ALERTE : lecture non autorisée pourtant acceptée')}catch(e){const denied=e.code==='permission-denied';report(name,!expectedAllowed&&denied,denied?'Refus Firebase (permission-denied)':`Erreur ${e.code||''} : ${e.message||e}`)}}
$('run').onclick=async()=>{const button=$('run');button.disabled=true;$('results').replaceChildren();passed=failed=0;$('status').textContent='Connexion et vérifications…';try{await setPersistence(auth,inMemoryPersistence);const cred=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value='';const uid=cred.user.uid;const c=name=>collection(db,...base,name);const d=(name,id)=>doc(db,...base,name,id);
await test('Structure accessible',true,()=>getDoc(doc(db,...base)));
await test('Mon profil collaborateur accessible',true,()=>getDoc(d('collaborators',uid)));
await test('Catalogue produits accessible',true,()=>getDocs(query(c('products'),limit(1))));
await test('Liste de tous les collaborateurs interdite',false,()=>getDocs(query(c('collaborators'),limit(1))));
await test('Liste globale des dépôts interdite',false,()=>getDocs(query(c('locations'),limit(1))));
await test('Liste globale des stocks interdite',false,()=>getDocs(query(c('stocks'),limit(1))));
await test('Liste globale des mouvements interdite',false,()=>getDocs(query(c('movements'),limit(1))));
await test('Liste des invitations interdite',false,()=>getDocs(query(c('invitations'),limit(1))));
const forbidden=$('forbidden').value.trim();if(forbidden)await test('Lecture directe du dépôt interdit',false,()=>getDoc(d('locations',forbidden)));
$('status').textContent=`Résultat : ${passed} conforme(s), ${failed} anomalie(s). ${failed?'Ne pas passer en production.':'Lectures testées conformes ; écritures non testées.'}`;
}catch(e){$('status').textContent='Impossible de lancer le test : '+(e.code||'')+' '+(e.message||e)}finally{button.disabled=false}};
$('logout').onclick=async()=>{await signOut(auth);$('status').textContent='Session de test déconnectée.'};
</script></body></html>
