<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion Stock Boisson — Test Firebase</title><style>body{font:16px system-ui;background:#101114;color:#f4f4f5;max-width:520px;margin:32px auto;padding:18px}section{background:#1d1f24;padding:20px;border-radius:14px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:9px;font:inherit}input{background:#101114;color:white;border:1px solid #666}button{background:#d7b16a;color:#151515;border:0;font-weight:700}small{color:#aaa}#status{white-space:pre-wrap;overflow-wrap:anywhere}#logout{display:none}</style></head><body><h1>GESTION STOCK BOISSON</h1><p>V2 · Test sécurisé de connexion Firebase</p><section><p><small>Ce test ne modifie aucun stock et ne remplace pas ton application actuelle.</small></p><form id="login"><label>E-mail<input id="email" type="email" required autocomplete="username"></label><label>Mot de passe<input id="password" type="password" required autocomplete="current-password"></label><button>Se connecter</button></form><button id="logout">Se déconnecter</button><p id="status" role="status">Initialisation…</p></section><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDnllgqNolR7nQ9DgyHU0uiu-OAkaNSyn4',authDomain:'gestion-stock-boisson.firebaseapp.com',projectId:'gestion-stock-boisson',storageBucket:'gestion-stock-boisson.firebasestorage.app',messagingSenderId:'31193951414',appId:'1:31193951414:web:72fc29011993ff0cae0a17',measurementId:'G-8H9P3M6BG0'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),status=document.getElementById('status'),login=document.getElementById('login'),logout=document.getElementById('logout');
const errors={'auth/invalid-credential':'Identifiants incorrects.','auth/too-many-requests':'Trop de tentatives. Réessaie plus tard.','auth/unauthorized-domain':'Domaine non autorisé dans Firebase.'};
login.onsubmit=async e=>{e.preventDefault();status.textContent='Connexion en cours…';try{await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value);document.getElementById('password').value=''}catch(err){status.textContent=errors[err.code]||('Connexion impossible : '+err.code)}};
logout.onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{login.style.display=user?'none':'block';logout.style.display=user?'block':'none';if(!user){status.textContent='Connecte-toi avec le compte propriétaire créé dans Firebase.';return}status.textContent='Compte connecté. Vérification de la structure…';try{const snapshot=await getDoc(doc(db,'structures','punish-concept'));if(!snapshot.exists()){status.textContent='Connecté, mais la structure punish-concept est introuvable.';return}const d=snapshot.data(),owner=d.ownerUid===user.uid,member=Array.isArray(d.memberUids)&&d.memberUids.includes(user.uid);status.textContent='Connexion réussie !\nStructure : '+String(d.name||'Punish Concept')+'\nRôle : '+(owner?'Propriétaire':member?'Collaborateur':'Non autorisé')+'\nAccès actif : '+(d.active===true?'oui':'non')+'\nAucun stock n’a été modifié.'}catch(err){status.textContent='Connexion réussie, mais lecture Firestore impossible : '+err.code+'\nVérifie les règles de sécurité.'}});
</script></body></html>
